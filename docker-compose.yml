# LabSentinel — DEVELOPMENT-ONLY PostgreSQL for the backend foundation.
#
#   docker compose up -d db        start
#   docker compose ps              wait for "healthy"
#   docker compose down            stop (data is kept in the named volume)
#   docker compose down -v         stop and DELETE the development data
#
# Credentials default to throwaway development values and can be overridden
# with POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB / POSTGRES_PORT in the
# shell or a git-ignored .env beside this file. This service is not a
# production database configuration.

name: labsentinel

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labsentinel}
      POSTGRES_USER: ${POSTGRES_USER:-labsentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labsentinel}
    ports:
      # Bound to loopback only, so the development database is not exposed to
      # the local network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - labsentinel-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  labsentinel-pgdata:
