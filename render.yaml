# LabSentinel — Render Blueprint (full-stack capstone deployment).
#
# Three resources, all from the capstone-development branch, all in one region
# so the API reaches the database over Render's private network:
#
#   labsentinel-db    Render Postgres 16
#   labsentinel-api   FastAPI, Docker (backend/Dockerfile)
#   labsentinel       React/Vite static site
#
# The public GitHub Pages classroom demo (main, Local Demo Mode) is separate
# and unaffected.
#
# No secret is in this file:
#   - DATABASE_URL comes from the database (fromDatabase);
#   - FHIR_PSEUDONYM_SALT is generated by Render (generateValue);
#   - the public URLs that do not exist until Render creates the services are
#     entered once in the Dashboard (sync: false).
# See docs/deployment.md, "Render deployment", for the exact steps.
#
# Plans: everything starts on "free" for testing. For the live presentation,
# see docs/deployment.md (free web services spin down when idle; free
# Postgres databases expire). Nothing here purchases anything.
#
# Auto-deploy is OFF: a push to capstone-development never changes the live
# site. Deploy deliberately with "Manual Deploy" in the Dashboard.

databases:
  - name: labsentinel-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: labsentinel
    user: labsentinel

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: labsentinel-api
    runtime: docker
    plan: free
    region: oregon
    branch: capstone-development
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Migrate to the Alembic head once, before serving (idempotent; no
    # seeding, no reset), then serve on 0.0.0.0:$PORT. Works on every plan;
    # on a paid plan a preDeployCommand ("alembic upgrade head") can replace
    # MIGRATE_ON_START (docs/deployment.md).
    dockerCommand: python -m app.serve
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: presentation
      # The live demonstration (FHIR ingestion, recalculation, evaluation page,
      # readiness) needs the development-only endpoints. They have no
      # authentication: set to "false" after the presentation period.
      # APP_ENV=production would refuse this flag at startup.
      - key: DEMO_ENDPOINTS_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: labsentinel-db
          property: connectionString
      - key: DATABASE_CONNECT_TIMEOUT
        value: "10"
      - key: FHIR_PSEUDONYM_SALT
        generateValue: true
      - key: FHIR_MAX_REQUEST_BYTES
        value: "1000000"
      - key: MIGRATE_ON_START
        value: "true"
      # The exact https origin of the static site below, e.g.
      # https://labsentinel.onrender.com — known only after Render creates it.
      - key: CORS_ORIGINS
        sync: false

  # --------------------------------------------------------- static site
  - type: web
    name: labsentinel
    runtime: static
    branch: capstone-development
    # The guard fails the build (instead of publishing a site that calls
    # localhost, http or a placeholder) until the Dashboard values are set.
    buildCommand: npm ci --include=dev && npx vite-node scripts/check-render-env.ts && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: "off"
    routes:
      # Single-page app: every path (/overview, /dashboard, /fhir-ingestion,
      # /dynamic-surveillance, /evaluation, /architecture, /smart/...) serves
      # index.html and React Router renders the route. Built assets are real
      # files and are served before this rewrite applies.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: LABSENTINEL_BASE_PATH
        value: /
      - key: VITE_DATA_SOURCE
        value: api
      # The API's public https URL, e.g. https://labsentinel-api.onrender.com
      # (no trailing slash) — known only after Render creates the API.
      - key: VITE_API_BASE_URL
        sync: false
      # SMART on FHIR sandbox: a public client with PKCE. There is no client
      # secret, and none may ever be added to a VITE_* variable.
      - key: VITE_SMART_ENABLED
        value: "true"
      - key: VITE_SMART_CLIENT_ID
        value: labsentinel-capstone-sandbox
      - key: VITE_SMART_SCOPES
        value: openid fhirUser patient/Observation.rs
      # Optional. Leave empty to use https://<this site>/smart/callback,
      # derived at run time; or set that exact URL.
      - key: VITE_SMART_REDIRECT_URI
        sync: false
