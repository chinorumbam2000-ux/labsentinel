<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LabSentinel — Demo Environment (Synthetic data only)</title>
    <script>
      /*
       * GitHub Pages has no server-side rewrites, so a direct request to
       * /labsentinel/dashboard returns this 404 page instead of the app.
       *
       * This turns the requested path into a query string and bounces to the
       * app root; index.html then puts the real path back with replaceState,
       * so React Router sees the route the visitor actually asked for.
       *
       * Keep the first path segment (/labsentinel) as the app's base.
       */
      (function redirectToApp() {
        var pathSegmentsToKeep = 1;
        var l = window.location;
        var origin =
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '');
        var basePath = l.pathname
          .split('/')
          .slice(0, 1 + pathSegmentsToKeep)
          .join('/');
        var routePath = l.pathname
          .slice(1)
          .split('/')
          .slice(pathSegmentsToKeep)
          .join('/')
          .replace(/&/g, '~and~');

        // Any "&" inside the original query must be escaped too, otherwise the
        // restore step in index.html splits it in the wrong place and a
        // multi-parameter deep link (?alert=...&view=...) arrives mangled.
        var query = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';

        l.replace(origin + basePath + '/?/' + routePath + query + l.hash);
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p>
        LabSentinel is a JavaScript application and requires JavaScript to be
        enabled. DEMO ENVIRONMENT — Synthetic data only.
      </p>
    </noscript>
  </body>
</html>
